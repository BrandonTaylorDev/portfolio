<svg xmlns="http://www.w3.org/2000/svg" viewBox="132 120 244 268" width="244" height="268">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#67e8f9"/>
      <stop offset="100%" style="stop-color:#0ea5e9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>



  <!-- Hexagon centered at 256,256 -->
  <polygon 
    points="256,130 370,193 370,319 256,382 142,319 142,193"
    fill="none" 
    stroke="url(#accentGrad)" 
    stroke-width="8"
    opacity="0.5"
  />

  <!-- Inner accent ring -->
  <polygon 
    points="256,162 346,212 346,300 256,350 166,300 166,212"
    fill="none" 
    stroke="url(#accentGrad)" 
    stroke-width="3"
    opacity="0.25"
  />

  <!-- BT monogram centered in hex -->
  <g filter="url(#glow)">
    <text 
      x="258" 
      y="256" 
      font-family="'Courier New', Courier, monospace" 
      font-size="148" 
      font-weight="900" 
      text-anchor="middle"
      dominant-baseline="central"
      fill="url(#accentGrad)"
      letter-spacing="-4"
    >BT</text>
  </g>

  <!-- Corner nodes (circuit-board aesthetic) -->
  <circle cx="142" cy="193" r="6" fill="#67e8f9" opacity="0.6"/>
  <circle cx="370" cy="193" r="6" fill="#67e8f9" opacity="0.6"/>
  <circle cx="370" cy="319" r="6" fill="#38bdf8" opacity="0.6"/>
  <circle cx="256" cy="382" r="6" fill="#38bdf8" opacity="0.6"/>
  <circle cx="142" cy="319" r="6" fill="#38bdf8" opacity="0.6"/>
  <circle cx="256" cy="130" r="6" fill="#67e8f9" opacity="0.6"/>
</svg>
